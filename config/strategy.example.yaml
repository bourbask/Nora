# Strategy config — schema with PLACEHOLDER values (public example).
# Copy to config/strategy.yaml and put your real accounts/targets there
# (strategy.yaml is gitignored — real amounts never get published).
version: 1
currency: EUR

dormant:
  safety_cushion_months: 6        # target months of expenses on liquid savings
  checking_buffer_eur: 1500       # cash allowed idle before cash-drag penalty
  target_savings_rate: 0.20
  accounts:                       # asset accounts counted as "dormant"
    - "Bank - Checking"
    - "Bank - Savings"
    - "Broker - Cash"
  remunerated:                    # dormant accounts that DO earn interest (no cash-drag)
    - "Bank - Savings"
  salary_override: null           # null = median of recent income; set to force a value
  reconcile_tolerance_eur: 100    # import coherence gap tolerance (macro accuracy)
  savings_band_pts: 5             # +/- band (points) around target savings rate
  one_offs: []                    # dated one-time expenses {name, amount, date, kind}
  recurring_charges:              # dated obligation ledger (Firefly bills unused)
    # optional: match = payee substring (default: name), day = usual debit day
    - {name: Example loan, amount: 300, freq: monthly, start: "2026-01", end: "2030-01", kind: loan, remaining_balance: 12000, match: "LOAN", day: 5}
    - {name: Example rent, amount: 700, freq: monthly, start: "2024-01", end: null, kind: rent, remaining_balance: null}

invested:
  target_buckets: {high: 0.10, mid: 0.70, low: 0.20}
  target_holdings: 15
  crypto_cap: 0.10
  accounts:
    - "Broker - Securities"
    - "Broker - Crypto"
  instrument_rules:               # keyword -> risk bucket + asset class; first match wins
    - {match: ["msci world", "s&p 500", "all-world", "monde"], bucket: low,  class: etf_broad}
    - {match: ["bitcoin", "btc", "ethereum", "eth", "crypto"], bucket: high, class: crypto}
    - {match: ["private equity", "private market"],            bucket: high, class: private}
    - {match: ["*"],                                          bucket: mid,  class: stock}

scores:
  dormant_weights:  {cushion: 0.5, cash_drag: 0.25, savings_rate: 0.25}
  invested_weights: {diversification: 0.4, class_align: 0.4, crypto_cap: 0.2}

alerts:                           # enable-map for GET /api/alerts (absent block = all on)
  drift: true
  cushion: true
  savings: true
  scores: true
  score_floor: 50                 # health-score alert threshold (0-100)

budget:                           # pay cycle, available amount, envelopes (absent = routes 503)
  pay: {payee_contains: "EMPLOYER", min_amount: 1000}
  accounts: ["Bank - Checking"]   # counted in the available amount (cushion/invested never are)
  margin_eur: 50
  cushion: {account: "Bank - Savings", floor_eur: 3000, ceiling_eur: 20000, warn_months: 3}
  postes:                         # list order = cut order (first trimmed first)
    - {name: restos,  category: "Restaurants", compressible: true,  floor_eur: 0}
    - {name: loisirs, category: "Loisirs",     compressible: true,  floor_eur: 0}
    - {name: courses, category: "Courses",     compressible: false, floor_eur: 0}
    - {name: essence, category: "Carburant",   compressible: false, floor_eur: 0}
  reference_cycles: 6
  unexpected_min_eur: 100
  consent_expires: null           # "YYYY-MM-DD"

transfer_categories: ["Virements", "Transfert", "Transfer", "Investissement", "Dépôts", "Espèces"]
